[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-transcriber"
version = "1.0.0"
description = "Ứng dụng Windows chép lời tiếng Trung và dịch tiếng Việt"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "sherpa-onnx>=1.12,<2", "numpy>=1.26,<3",
  "soundfile>=0.12", "sounddevice>=0.5",
  "imageio-ffmpeg>=0.5", "platformdirs>=4", "jsonschema>=4", "psutil>=6"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "pyinstaller>=6"]

[project.scripts]
chinese-transcriber = "chinese_transcriber.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
